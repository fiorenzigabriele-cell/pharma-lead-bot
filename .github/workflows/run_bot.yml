name: Run Weekly Lead Generation Bot

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests pandas openpyxl google-genai feedparser

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      run: python lead_bot.py

    - name: Save report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: intelligence-report
        path: |
          Syntegon_Intelligence_Report_*.xlsx
          leads_master.xlsx
        if-no-files-found: warn

    - name: Commit leads history
      if: always()
      run: |
        git config user.name "pharma-lead-bot"
        git config user.email "bot@users.noreply.github.com"
        git add leads_master.xlsx 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "Nessuna modifica allo storico"
        else
          git commit -m "Update leads history"
          git pull --rebase
          git push
        fi
